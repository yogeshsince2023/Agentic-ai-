<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic AI — Neural Interface</title>
    <meta name="description" content="Futuristic AI agent powered by Google Gemini with tool-use capabilities.">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #05080f;
            --bg-secondary: #0a1628;
            --bg-card: rgba(10, 22, 40, 0.6);
            --accent-cyan: #00f0ff;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-green: #10b981;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #475569;
            --border-glow: rgba(0, 240, 255, 0.15);
            --glass: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(0, 240, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* === Animated Background === */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .bg-gradient {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(0, 240, 255, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(168, 85, 247, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.03) 0%, transparent 50%);
            z-index: 1;
            animation: gradientShift 20s ease-in-out infinite alternate;
        }

        @keyframes gradientShift {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        /* === Layout === */
        .app-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* === Header === */
        .header {
            text-align: center;
            padding: 20px 0 16px;
            position: relative;
        }

        .header h1 {
            font-family: 'Orbitron', monospace;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }

        .header h1::after {
            content: '';
            display: block;
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            margin: 10px auto 0;
            animation: lineGlow 3s ease-in-out infinite;
        }

        @keyframes lineGlow {
            0%, 100% { opacity: 0.4; width: 80px; }
            50% { opacity: 1; width: 140px; }
        }

        .header .subtitle {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 8px;
            font-family: 'Orbitron', monospace;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
            font-size: 0.65rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .status-dot {
            width: 6px; height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 8px var(--accent-green);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* === Controls === */
        .controls {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .control-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            font-size: 0.7rem;
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .control-btn.active {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        /* === Chat Area === */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 4px;
            scroll-behavior: smooth;
            mask-image: linear-gradient(to bottom, transparent 0%, black 3%, black 97%, transparent 100%);
        }

        .chat-container::-webkit-scrollbar { width: 3px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.2);
            border-radius: 3px;
        }

        /* === Messages === */
        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            animation: messageIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            align-items: flex-start;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.user { flex-direction: row-reverse; }

        .avatar {
            width: 34px; height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
            position: relative;
        }

        .avatar.ai {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(168, 85, 247, 0.15));
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
        }

        .avatar.user-av {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(236, 72, 153, 0.15));
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        .bubble {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 0.88rem;
            line-height: 1.65;
            position: relative;
        }

        .message.ai .bubble {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            border-radius: 4px 16px 16px 16px;
        }

        .message.user .bubble {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(168, 85, 247, 0.08));
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 16px 4px 16px 16px;
        }

        .bubble code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--accent-cyan);
        }

        .bubble pre {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 240, 255, 0.08);
            border-radius: 8px;
            padding: 12px;
            margin: 8px 0;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            line-height: 1.5;
        }

        .bubble pre code {
            background: none;
            padding: 0;
        }

        .bubble strong { color: var(--accent-cyan); font-weight: 600; }

        /* Tool activity badge */
        .tool-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            padding: 3px 10px;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        /* === Typing Indicator === */
        .typing-indicator {
            display: none;
            gap: 12px;
            margin-bottom: 16px;
            align-items: flex-start;
        }

        .typing-indicator.visible { display: flex; }

        .typing-dots {
            display: flex;
            gap: 4px;
            padding: 16px 20px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 4px 16px 16px 16px;
            backdrop-filter: blur(20px);
        }

        .typing-dots span {
            width: 7px; height: 7px;
            background: var(--accent-cyan);
            border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        /* === Input Area === */
        .input-area {
            padding: 16px 0 8px;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 6px;
            backdrop-filter: blur(20px);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.05), inset 0 0 30px rgba(0, 240, 255, 0.02);
        }

        #message-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            padding: 10px 14px;
            resize: none;
            max-height: 120px;
            line-height: 1.5;
        }

        #message-input::placeholder { color: var(--text-muted); }

        .send-btn {
            width: 44px; height: 44px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: var(--bg-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
            align-self: flex-end;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
        }

        .send-btn:active { transform: scale(0.95); }

        .send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn svg { width: 20px; height: 20px; }

        /* === Welcome Screen === */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 20px;
        }

        .welcome-icon {
            width: 80px; height: 80px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(168, 85, 247, 0.1));
            border: 1px solid rgba(0, 240, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            animation: float 6s ease-in-out infinite;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.08);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .welcome h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: var(--text-secondary);
        }

        .suggestions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
        }

        .suggestion {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            backdrop-filter: blur(10px);
        }

        .suggestion:hover {
            border-color: rgba(0, 240, 255, 0.3);
            color: var(--text-primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.05);
        }

        .suggestion .icon { margin-right: 6px; }

        /* === Audio Toggle === */
        .audio-visualizer {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 14px;
        }

        .audio-bar {
            width: 2px;
            background: var(--accent-green);
            border-radius: 1px;
            transition: height 0.1s;
        }

        .audio-visualizer.playing .audio-bar {
            animation: audioWave 1.2s ease-in-out infinite;
        }

        .audio-bar:nth-child(1) { animation-delay: 0s; }
        .audio-bar:nth-child(2) { animation-delay: 0.15s; }
        .audio-bar:nth-child(3) { animation-delay: 0.3s; }
        .audio-bar:nth-child(4) { animation-delay: 0.45s; }
        .audio-bar:nth-child(5) { animation-delay: 0.6s; }

        @keyframes audioWave {
            0%, 100% { height: 3px; }
            50% { height: 14px; }
        }

        /* === Responsive === */
        @media (max-width: 640px) {
            .app-container { padding: 10px; }
            .header h1 { font-size: 1.2rem; letter-spacing: 3px; }
            .suggestions { grid-template-columns: 1fr; }
            .bubble { max-width: 85%; }
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="bg-gradient"></div>

<div class="app-container">
    <!-- Header -->
    <header class="header">
        <h1>Agentic AI</h1>
        <div class="subtitle">Neural Interface v1.0</div>
        <div class="status-bar">
            <span><span class="status-dot"></span>SYSTEM ONLINE</span>
            <span>MODEL: GEMINI 3.6</span>
            <span>TOOLS: 6 ACTIVE</span>
        </div>
    </header>

    <!-- Controls -->
    <div class="controls">
        <button class="control-btn" id="audio-toggle" onclick="toggleAudio()">
            <span class="audio-visualizer" id="audio-viz">
                <span class="audio-bar" style="height:3px"></span>
                <span class="audio-bar" style="height:5px"></span>
                <span class="audio-bar" style="height:3px"></span>
                <span class="audio-bar" style="height:7px"></span>
                <span class="audio-bar" style="height:3px"></span>
            </span>
            &nbsp;AMBIENT
        </button>
        <button class="control-btn" onclick="clearChat()">⟲ CLEAR</button>
    </div>

    <!-- Chat / Welcome -->
    <div class="chat-container" id="chat-container">
        <div class="welcome" id="welcome-screen">
            <div class="welcome-icon">⟡</div>
            <h2>READY TO ASSIST</h2>
            <p style="color: var(--text-muted); font-size: 0.8rem; max-width: 400px;">
                I can search the web, solve math, read & write files, and think through complex problems.
            </p>
        </div>
    </div>

    <!-- Typing Indicator -->
    <div class="typing-indicator" id="typing-indicator">
        <div class="avatar ai">⟡</div>
        <div class="typing-dots">
            <span></span><span></span><span></span>
        </div>
    </div>

    <!-- Input -->
    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="message-input" placeholder="Ask me anything..." rows="1"
                      onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
            <button class="send-btn" id="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>
</div>

<script>
// === Background Particle Canvas ===
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Particle {
    constructor() { this.reset(); }
    reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.size = Math.random() * 1.5 + 0.5;
        this.alpha = Math.random() * 0.3 + 0.05;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 240, 255, ${this.alpha})`;
        ctx.fill();
    }
}

for (let i = 0; i < 80; i++) particles.push(new Particle());

function drawParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });

    // Draw faint connections
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `rgba(0, 240, 255, ${0.03 * (1 - dist / 120)})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }
        }
    }
    requestAnimationFrame(drawParticles);
}
drawParticles();

// === Ambient Sound (Web Audio API) ===
let audioCtx = null;
let audioPlaying = false;
let audioNodes = [];

function createAmbient() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const master = audioCtx.createGain();
    master.gain.value = 0.12;
    master.connect(audioCtx.destination);

    // Deep drone — C2 (65 Hz)
    const drone1 = audioCtx.createOscillator();
    drone1.type = 'sine';
    drone1.frequency.value = 65;
    const drone1Gain = audioCtx.createGain();
    drone1Gain.gain.value = 0.4;
    drone1.connect(drone1Gain).connect(master);
    drone1.start();
    audioNodes.push(drone1);

    // Harmonic — G2 (98 Hz)
    const drone2 = audioCtx.createOscillator();
    drone2.type = 'sine';
    drone2.frequency.value = 98;
    const drone2Gain = audioCtx.createGain();
    drone2Gain.gain.value = 0.2;
    drone2.connect(drone2Gain).connect(master);
    drone2.start();
    audioNodes.push(drone2);

    // High shimmer — E4 (330 Hz), very quiet
    const shimmer = audioCtx.createOscillator();
    shimmer.type = 'sine';
    shimmer.frequency.value = 330;
    const shimmerGain = audioCtx.createGain();
    shimmerGain.gain.value = 0.03;
    // Slow LFO modulating shimmer volume
    const lfo = audioCtx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.08; // Very slow
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.02;
    lfo.connect(lfoGain).connect(shimmerGain.gain);
    lfo.start();
    shimmer.connect(shimmerGain).connect(master);
    shimmer.start();
    audioNodes.push(shimmer, lfo);

    // Filtered noise — like distant wind
    const bufferSize = audioCtx.sampleRate * 2;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = noiseBuffer;
    noise.loop = true;
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'lowpass';
    noiseFilter.frequency.value = 200;
    noiseFilter.Q.value = 1;
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.value = 0.15;
    noise.connect(noiseFilter).connect(noiseGain).connect(master);
    noise.start();
    audioNodes.push(noise);
}

function toggleAudio() {
    const viz = document.getElementById('audio-viz');
    if (!audioPlaying) {
        if (!audioCtx) createAmbient();
        else audioCtx.resume();
        audioPlaying = true;
        viz.classList.add('playing');
        document.getElementById('audio-toggle').classList.add('active');
    } else {
        audioCtx.suspend();
        audioPlaying = false;
        viz.classList.remove('playing');
        document.getElementById('audio-toggle').classList.remove('active');
    }
}

// === Chat Logic ===
const chatContainer = document.getElementById('chat-container');
const welcomeScreen = document.getElementById('welcome-screen');
const typingIndicator = document.getElementById('typing-indicator');
const messageInput = document.getElementById('message-input');
const sendBtn = document.getElementById('send-btn');
let chatStarted = false;

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

function useSuggestion(el) {
    const text = el.textContent.replace(/^[⊛⊘⊙⊞]\s*/, '').trim();
    messageInput.value = text;
    sendMessage();
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function formatResponse(text) {
    // Very basic markdown: bold, inline code, code blocks
    let html = escapeHtml(text);
    // Code blocks
    html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Bold
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Newlines
    html = html.replace(/\n/g, '<br>');
    return html;
}

function addMessage(role, content, toolLog) {
    if (!chatStarted) {
        chatStarted = true;
        welcomeScreen.style.display = 'none';
    }

    const msg = document.createElement('div');
    msg.className = `message ${role}`;

    const avatarClass = role === 'ai' ? 'ai' : 'user-av';
    const avatarText = role === 'ai' ? '⟡' : '⟐';

    let bubbleContent = '';
    if (toolLog) {
        const tools = toolLog.match(/Calling: (\w+)/g) || [];
        const toolNames = tools.map(t => t.replace('Calling: ', ''));
        if (toolNames.length > 0) {
            bubbleContent += `<div class="tool-badge">⚙ ${toolNames.join(' → ')}</div>`;
        }
    }
    bubbleContent += formatResponse(content);

    msg.innerHTML = `
        <div class="avatar ${avatarClass}">${avatarText}</div>
        <div class="bubble">${bubbleContent}</div>
    `;

    chatContainer.appendChild(msg);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text) return;

    messageInput.value = '';
    messageInput.style.height = 'auto';
    sendBtn.disabled = true;

    addMessage('user', text);

    // Show typing
    typingIndicator.classList.add('visible');
    chatContainer.scrollTop = chatContainer.scrollHeight;

    try {
        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        typingIndicator.classList.remove('visible');
        addMessage('ai', data.response, data.tool_log);
    } catch (err) {
        typingIndicator.classList.remove('visible');
        addMessage('ai', 'Connection error. Is the server running?');
    }

    sendBtn.disabled = false;
    messageInput.focus();
}

async function clearChat() {
    try { await fetch('/api/clear', { method: 'POST' }); } catch {}
    // Remove all messages but keep welcome
    const messages = chatContainer.querySelectorAll('.message');
    messages.forEach(m => m.remove());
    chatStarted = false;
    welcomeScreen.style.display = '';
}

// Focus input on load
messageInput.focus();
</script>
</body>
</html>
